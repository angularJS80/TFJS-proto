<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MobileNetV1 추론 테스트</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
<video id="webcam" autoplay playsinline width="224" height="224"></video>
<p id="result">로딩 중...</p>

<script>
  async function setup() {
    const video = document.getElementById('webcam');
    const result = document.getElementById('result');

    // 웹캠 연결
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    // 모델 로딩 (fromTFHub 제거, await 추가)
    const MODEL_URL = 'https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_1.0_224/model.json';
    const model = await tf.loadLayersModel(MODEL_URL);

    result.textContent = '모델 로드 완료';

    // 추론
    video.addEventListener('loadeddata', () => {
      setInterval(async () => {
        const input = tf.tidy(() => {
          return tf.browser.fromPixels(video)
            .resizeNearestNeighbor([224, 224])
            .toFloat()
            .div(127.5)
            .sub(1)
            .expandDims();
        });

        const prediction = model.predict(input);
        const logits = await prediction.data();
        const topIndex = logits.indexOf(Math.max(...logits));

        result.textContent = `Top class index: ${topIndex}`;

        tf.dispose([input, prediction]);
      }, 1000);
    });
  }

  setup();
</script>
</body>
</html>
